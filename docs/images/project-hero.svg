<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" role="img" aria-labelledby="title desc">
  <title id="title">Projeto SPTrans - Public Transport Fleet Telemetry DW</title>
  <desc id="desc">Rastreamento de frota de ônibus de São Paulo em tempo real com linhas intermodais e radar GPS</desc>
  <style>
    :root{ --bg:#180e02; --amber:#f59e0b; --orange:#f97316; --yellow:#fde047; --green:#22c55e; --ink:#fffbeb; --sub:#fef08a; }
    *{transform-box:fill-box;}
    @keyframes radarSpin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .radarSweep {
      transform-origin: 400px 160px;
      animation: radarSpin 4s linear infinite;
    }
    @keyframes busMove1 {
      0% { transform: translate(120px, 160px); }
      50% { transform: translate(400px, 160px); }
      100% { transform: translate(680px, 160px); }
    }
    .busPing1 { animation: busMove1 5s ease-in-out infinite; }
    @keyframes busMove2 {
      0% { transform: translate(400px, 60px); }
      100% { transform: translate(400px, 260px); }
    }
    .busPing2 { animation: busMove2 4s ease-in-out infinite alternate; }
  </style>
  <rect width="800" height="360" fill="var(--bg)" rx="12"/>
  <g transform="translate(400, 160)" opacity="0.3">
    <circle r="60" fill="none" stroke="var(--amber)" stroke-width="1.5"/>
    <circle r="110" fill="none" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle r="150" fill="none" stroke="var(--amber)" stroke-width="1.5"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke="var(--amber)" stroke-width="1"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="var(--amber)" stroke-width="1"/>
  </g>
  <g class="radarSweep">
    <path d="M 400,160 L 550,160 A 150,150 0 0,0 400,10 Z" fill="url(#radarGrad)" opacity="0.4"/>
  </g>
  <defs>
    <linearGradient id="radarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--amber)" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="var(--amber)" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <path d="M 100,160 L 700,160" stroke="#78350f" stroke-width="14" stroke-linecap="round"/>
  <path d="M 100,160 L 700,160" stroke="var(--amber)" stroke-width="4" stroke-linecap="round"/>
  <path d="M 400,50 L 400,270" stroke="#78350f" stroke-width="14" stroke-linecap="round"/>
  <path d="M 400,50 L 400,270" stroke="var(--orange)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="400" cy="160" r="16" fill="var(--amber)" stroke="var(--ink)" stroke-width="3"/>
  <text x="400" y="195" font-size="11" font-weight="800" fill="var(--yellow)" text-anchor="middle" font-family="system-ui">TERM. PARQUE DOM PEDRO</text>
  <circle cx="200" cy="160" r="10" fill="#78350f" stroke="var(--amber)" stroke-width="2"/>
  <circle cx="600" cy="160" r="10" fill="#78350f" stroke="var(--amber)" stroke-width="2"/>
  <circle cx="400" cy="90" r="10" fill="#78350f" stroke="var(--orange)" stroke-width="2"/>
  <circle cx="400" cy="230" r="10" fill="#78350f" stroke="var(--orange)" stroke-width="2"/>
  <g class="busPing1">
    <rect x="-12" y="-8" width="24" height="16" rx="4" fill="var(--yellow)" stroke="#000" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="var(--yellow)" opacity="0.3"/>
  </g>
  <g class="busPing2">
    <rect x="-8" y="-12" width="16" height="24" rx="4" fill="var(--green)" stroke="#000" stroke-width="1.5"/>
  </g>
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="180" height="80" rx="10" fill="#451a03" stroke="var(--amber)" stroke-width="1.5"/>
    <text x="16" y="24" font-size="11" font-weight="700" fill="var(--sub)" font-family="system-ui">FROTA EM OPERAÇÃO</text>
    <text x="16" y="56" font-size="24" font-weight="900" fill="var(--ink)" font-family="system-ui">14.850</text>
    <text x="16" y="70" font-size="10" fill="var(--yellow)" font-family="system-ui">API Olho Vivo SPTrans</text>
  </g>
  <g transform="translate(580, 40)">
    <rect x="0" y="0" width="180" height="80" rx="10" fill="#451a03" stroke="var(--amber)" stroke-width="1.5"/>
    <text x="16" y="24" font-size="11" font-weight="700" fill="var(--sub)" font-family="system-ui">PONTUALIDADE</text>
    <text x="16" y="56" font-size="24" font-weight="900" fill="var(--green)" font-family="system-ui">98.4%</text>
    <text x="16" y="70" font-size="10" fill="#86efac" font-family="system-ui">Cumprimento de partidas</text>
  </g>
</svg>